<!DOCTYPE html>
<html lang="en">
{%- include head.html -%}
<body data-baseurl="{{ site.baseurl }}">
  <script>
    // Keep the code panel closed if the reader closed it on an earlier page.
    try { if (localStorage.getItem("codePanelClosed") === "1") { document.body.classList.add("code-panel-closed"); } } catch (e) {}
  </script>
  {%- include book-order.html -%}
  {%- include sidebar.html -%}
  {%- include code-panel.html -%}

  <main class="book-main">
    <div class="wrapper">
      <article>
        {{ content }}
      </article>
      {%- include book-nav.html -%}
    </div>
  </main>

  <script src="{{ "/assets/js/copy-code.js" | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ "/assets/js/menu.js" | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ "/assets/js/code-panel.js" | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
