<aside class="code-panel" id="code-panel" aria-label="Code viewer">
  <div class="code-panel-header">
    <span class="code-panel-title" id="code-panel-title">Code</span>
    <span class="code-panel-actions">
      <button class="code-panel-button" id="code-panel-copy" type="button" hidden>Copy</button>
      <a class="code-panel-button" id="code-panel-github" href="https://github.com/aarora79/k8s-book" target="_blank" rel="noopener" hidden>GitHub</a>
      <button class="code-panel-button" id="code-panel-close" type="button" aria-label="Close the code panel">Close</button>
    </span>
  </div>
  <div class="code-panel-body" id="code-panel-body">
    <p class="code-panel-empty">Click a link to a code file in the text, such as <code>step1/main.go</code>, and the whole file opens here, beside the explanation.</p>
  </div>
</aside>
