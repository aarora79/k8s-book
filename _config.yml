# GitHub Pages site for the book. The Pages workflow builds it with Jekyll 4.
title: Help me learn Kubernetes
description: Learn Kubernetes by rebuilding its parts in Go.
theme: minima

# Every page uses the book layout in _layouts/book.html.
# Chapters show shell and Go templates such as '{{.Names}}'. Turn Liquid off
# so Jekyll prints them as written instead of reading them as template tags.
defaults:
  - scope:
      path: ""
    values:
      layout: book
      render_with_liquid: false

# Turn links to README.md and other .md files into links to the built pages.
relative_links:
  enabled: true
  collections: false

# The reading order, the sidebar and the contents page come from _data/toc.yml.

# The cover page (index.html) is the home page, so README.md becomes the
# Introduction page. Jekyll skips a root README unless it is listed here.
include:
  - README.md

# Files for contributors and agents, not readers.
exclude:
  - AGENTS.md
  - CLAUDE.md
  - plans/
  - tools/
  - Gemfile
  - Gemfile.lock
  - go.mod
  - Makefile
  - vendor/
