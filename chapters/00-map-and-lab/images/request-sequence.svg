<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="title desc">
  <title id="title">One request, step by step</title>
  <desc id="desc">A sequence diagram with eight lifelines: kubectl, the API server, etcd, the Deployment controller, the ReplicaSet controller, the scheduler, the kubelet and kube-proxy. In five numbered bands: kubectl creates a Deployment and the API server stores it in etcd; the Deployment controller hears about it and creates a ReplicaSet, and the ReplicaSet controller hears about that and creates three Pods; the scheduler hears about Pods with no node and writes three Bindings; the kubelet hears about a Pod for its node, starts the containers with containerd and runc, and writes the status Running; kubectl creates a Service, and kube-proxy hears about it and writes kernel rules. Every arrow starts or ends at the API server.</desc>
  <defs>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2b2a"/></marker>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1d2b2a; font-size: 13px; }
    .head { font-size: 14px; font-weight: 600; }
    .lbl { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
    .lblh { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; fill: #0f766e; }
    .num { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .note { font-size: 13px; fill: #2b3a39; font-style: italic; }
    .box { fill: #fffdf5; stroke: #52615f; stroke-width: 1.5; }
    .hub { fill: #e0f2ef; stroke: #0f766e; stroke-width: 2; }
    .life { stroke: #9aa6a4; stroke-width: 1.2; stroke-dasharray: 4 4; }
    .write { stroke: #1d2b2a; stroke-width: 1.6; fill: none; }
    .hear { stroke: #0f766e; stroke-width: 1.6; stroke-dasharray: 7 4; fill: none; }
    .band { fill: #f3f6f5; }
  </style>
  <rect width="960" height="720" fill="#ffffff"/>

  <!-- numbered bands, matching the numbered list in the text -->
  <rect class="band" x="10" y="90" width="940" height="80"/>
  <rect class="band" x="10" y="330" width="940" height="80"/>
  <rect class="band" x="10" y="530" width="940" height="120"/>
  <circle cx="26" cy="130" r="12" fill="#0f766e"/><text class="num" x="26" y="135" text-anchor="middle">1</text>
  <circle cx="26" cy="250" r="12" fill="#0f766e"/><text class="num" x="26" y="255" text-anchor="middle">2</text>
  <circle cx="26" cy="370" r="12" fill="#0f766e"/><text class="num" x="26" y="375" text-anchor="middle">3</text>
  <circle cx="26" cy="470" r="12" fill="#0f766e"/><text class="num" x="26" y="475" text-anchor="middle">4</text>
  <circle cx="26" cy="590" r="12" fill="#0f766e"/><text class="num" x="26" y="595" text-anchor="middle">5</text>

  <!-- lifelines -->
  <line class="life" x1="90" y1="70" x2="90" y2="660"/>
  <line class="life" x1="205" y1="70" x2="205" y2="660"/>
  <line class="life" x1="320" y1="70" x2="320" y2="660"/>
  <line class="life" x1="435" y1="70" x2="435" y2="660"/>
  <line class="life" x1="550" y1="70" x2="550" y2="660"/>
  <line class="life" x1="665" y1="70" x2="665" y2="660"/>
  <line class="life" x1="780" y1="70" x2="780" y2="660"/>
  <line class="life" x1="893" y1="70" x2="893" y2="660"/>
  <rect x="200" y="70" width="10" height="590" fill="#e0f2ef" stroke="#0f766e" stroke-width="1"/>

  <!-- heads -->
  <rect class="box" x="40" y="20" width="100" height="50" rx="8"/>
  <text class="head" x="90" y="50" text-anchor="middle">kubectl</text>
  <rect class="hub" x="155" y="20" width="100" height="50" rx="8"/>
  <text class="head" x="205" y="50" text-anchor="middle">API server</text>
  <rect class="box" x="270" y="20" width="100" height="50" rx="8"/>
  <text class="head" x="320" y="50" text-anchor="middle">etcd</text>
  <rect class="box" x="385" y="20" width="100" height="50" rx="8"/>
  <text class="head" x="435" y="41" text-anchor="middle">Deployment</text>
  <text class="head" x="435" y="59" text-anchor="middle">controller</text>
  <rect class="box" x="500" y="20" width="100" height="50" rx="8"/>
  <text class="head" x="550" y="41" text-anchor="middle">ReplicaSet</text>
  <text class="head" x="550" y="59" text-anchor="middle">controller</text>
  <rect class="box" x="615" y="20" width="100" height="50" rx="8"/>
  <text class="head" x="665" y="50" text-anchor="middle">scheduler</text>
  <rect class="box" x="730" y="20" width="100" height="50" rx="8"/>
  <text class="head" x="780" y="50" text-anchor="middle">kubelet</text>
  <rect class="box" x="845" y="20" width="100" height="50" rx="8"/>
  <text class="head" x="895" y="50" text-anchor="middle">kube-proxy</text>

  <!-- 1. kubectl creates the Deployment, the API server stores it -->
  <line class="write" x1="90" y1="115" x2="198" y2="115" marker-end="url(#w)"/>
  <text class="lbl" x="46" y="108">create Deployment</text>
  <text class="lbl" x="46" y="132">web, replicas: 3</text>
  <line class="write" x1="212" y1="155" x2="318" y2="155" marker-end="url(#w)"/>
  <text class="lbl" x="218" y="148">store it</text>

  <!-- 2. two controllers -->
  <line class="hear" x1="212" y1="195" x2="433" y2="195" marker-end="url(#h)"/>
  <text class="lblh" x="218" y="188">watch: a new Deployment</text>
  <line class="write" x1="435" y1="225" x2="212" y2="225" marker-end="url(#w)"/>
  <text class="lbl" x="218" y="218">create ReplicaSet web-5f6b554666</text>
  <line class="hear" x1="212" y1="265" x2="548" y2="265" marker-end="url(#h)"/>
  <text class="lblh" x="218" y="258">watch: a new ReplicaSet</text>
  <line class="write" x1="550" y1="295" x2="212" y2="295" marker-end="url(#w)"/>
  <text class="lbl" x="218" y="288">create 3 Pods, with no node yet</text>

  <!-- 3. scheduler -->
  <line class="hear" x1="212" y1="355" x2="663" y2="355" marker-end="url(#h)"/>
  <text class="lblh" x="218" y="348">watch: 3 Pods with no node</text>
  <line class="write" x1="665" y1="385" x2="212" y2="385" marker-end="url(#w)"/>
  <text class="lbl" x="218" y="378">3 Bindings: lab-worker, lab-worker, lab-worker2</text>

  <!-- 4. kubelet -->
  <line class="hear" x1="212" y1="430" x2="778" y2="430" marker-end="url(#h)"/>
  <text class="lblh" x="218" y="423">watch: a Pod for my node</text>
  <path class="write" d="M780,450 h30 v22 h-28" marker-end="url(#w)"/>
  <text class="lbl" x="770" y="466" text-anchor="end">start its containers with containerd and runc</text>
  <line class="write" x1="780" y1="505" x2="212" y2="505" marker-end="url(#w)"/>
  <text class="lbl" x="218" y="498">status: Running</text>

  <!-- 5. Service and kube-proxy -->
  <line class="write" x1="90" y1="555" x2="198" y2="555" marker-end="url(#w)"/>
  <text class="lbl" x="46" y="548">create Service web</text>
  <line class="hear" x1="212" y1="595" x2="891" y2="595" marker-end="url(#h)"/>
  <text class="lblh" x="218" y="588">watch: a new Service, and the Pods behind it</text>
  <path class="write" d="M893,612 h30 v22 h-28" marker-end="url(#w)"/>
  <text class="lbl" x="883" y="628" text-anchor="end">write kernel rules for the Service's address</text>

  <!-- key -->
  <line class="write" x1="40" y1="690" x2="90" y2="690" marker-end="url(#w)"/>
  <text class="note" x="100" y="695">a write to the API server (each one is stored in etcd)</text>
  <line class="hear" x1="500" y1="690" x2="550" y2="690" marker-end="url(#h)"/>
  <text class="note" x="560" y="695">the API server tells a watcher about a change</text>
</svg>
