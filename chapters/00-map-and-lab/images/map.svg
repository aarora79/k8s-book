<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc">
  <title id="title">The map of Kubernetes</title>
  <desc id="desc">The API server is the hub. Only the API server talks to etcd. kubectl sends requests to the API server, the API server calls admission webhooks, and the controllers, scheduler, kubelet, kube-proxy and gateway all watch the API server.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52615f"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1d2b2a; }
    .name { font-size: 18px; font-weight: 600; }
    .ch { font-size: 14px; fill: #52615f; }
    .note { font-size: 14px; fill: #2b3a39; font-style: italic; }
    .box { fill: #fffdf5; stroke: #52615f; stroke-width: 1.5; }
    .hub { fill: #e0f2ef; stroke: #0f766e; stroke-width: 2; }
    .line { stroke: #52615f; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="900" height="450" fill="#ffffff"/>

  <!-- etcd -->
  <rect class="box" x="380" y="20" width="140" height="50" rx="8"/>
  <text class="name" x="450" y="51" text-anchor="middle">etcd</text>
  <line class="line" x1="450" y1="70" x2="450" y2="140" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="note" x="462" y="110">only the API server talks to etcd</text>

  <!-- API server -->
  <rect class="hub" x="360" y="140" width="180" height="60" rx="8"/>
  <text class="name" x="450" y="176" text-anchor="middle">API server</text>

  <!-- kubectl -->
  <rect class="box" x="70" y="145" width="150" height="50" rx="8"/>
  <text class="name" x="145" y="176" text-anchor="middle">kubectl</text>
  <text class="ch" x="145" y="215" text-anchor="middle">(ch 2, 3)</text>
  <line class="line" x1="220" y1="170" x2="358" y2="170" marker-end="url(#arrow)"/>

  <!-- admission webhooks -->
  <rect class="box" x="660" y="145" width="225" height="50" rx="8"/>
  <text class="name" x="772" y="176" text-anchor="middle">admission webhooks</text>
  <text class="ch" x="772" y="215" text-anchor="middle">(ch 9)</text>
  <line class="line" x1="540" y1="170" x2="658" y2="170" marker-end="url(#arrow)"/>
  <text class="note" x="600" y="160" text-anchor="middle">calls</text>

  <!-- watch bus -->
  <line class="line" x1="450" y1="300" x2="450" y2="202" marker-end="url(#arrow)"/>
  <text class="note" x="462" y="255">every component below watches the API server</text>
  <line class="line" x1="90" y1="300" x2="810" y2="300"/>
  <line class="line" x1="90" y1="300" x2="90" y2="340"/>
  <line class="line" x1="270" y1="300" x2="270" y2="340"/>
  <line class="line" x1="450" y1="300" x2="450" y2="340"/>
  <line class="line" x1="630" y1="300" x2="630" y2="340"/>
  <line class="line" x1="810" y1="300" x2="810" y2="340"/>

  <!-- components -->
  <rect class="box" x="15" y="340" width="150" height="50" rx="8"/>
  <text class="name" x="90" y="371" text-anchor="middle">controllers</text>
  <text class="ch" x="90" y="415" text-anchor="middle">(ch 4, 8)</text>

  <rect class="box" x="195" y="340" width="150" height="50" rx="8"/>
  <text class="name" x="270" y="371" text-anchor="middle">scheduler</text>
  <text class="ch" x="270" y="415" text-anchor="middle">(ch 5)</text>

  <rect class="box" x="375" y="340" width="150" height="50" rx="8"/>
  <text class="name" x="450" y="371" text-anchor="middle">kubelet</text>
  <text class="ch" x="450" y="415" text-anchor="middle">(ch 1, 6)</text>

  <rect class="box" x="555" y="340" width="150" height="50" rx="8"/>
  <text class="name" x="630" y="371" text-anchor="middle">kube-proxy</text>
  <text class="ch" x="630" y="415" text-anchor="middle">(ch 7)</text>

  <rect class="box" x="735" y="340" width="150" height="50" rx="8"/>
  <text class="name" x="810" y="371" text-anchor="middle">gateway</text>
  <text class="ch" x="810" y="415" text-anchor="middle">(ch 10)</text>
</svg>
